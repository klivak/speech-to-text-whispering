[package]
name = "whisper-uk"
version = "0.2.1"
edition = "2021"
description = "Мінімальний голосовий ввід українською (Groq Whisper) зі вставкою в курсор"

[[bin]]
name = "whisper-uk"
path = "src/main.rs"

[dependencies]
tao = "0.30"
tray-icon = "0.19"
global-hotkey = "0.6"
cpal = "0.15"
hound = "3.5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "multipart", "rustls-tls"] }
arboard = "3.4"
enigo = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
# Відкриття файлів/URL напряму через ShellExecuteW, без запуску cmd.exe
# (уникаємо помилок запуску консольних утиліт і блимання консолі).
windows = { version = "0.58", features = [
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
