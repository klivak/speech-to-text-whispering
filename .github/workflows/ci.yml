name: CI

# Перевіряє, що проєкт збирається при кожному push/PR у master.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      - name: Check formatting
        run: cargo fmt --check
